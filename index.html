<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>칸반보드 - Kanban Board</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Auth and Script -->
  <script type="module" src="auth.js"></script>
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <!-- Login Page -->
  <div id="login-page" class="login-page">
    <div class="login-container">
      <h1>칸반보드</h1>
      <p class="login-subtitle">로그인하여 시작하세요</p>

      <!-- Email Login Form -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">로그인</button>
        <button class="auth-tab" data-tab="signup">회원가입</button>
      </div>

      <form id="email-auth-form" class="email-auth-form">
        <input
          type="email"
          id="auth-email"
          class="auth-input"
          placeholder="이메일"
          required
        >
        <input
          type="password"
          id="auth-password"
          class="auth-input"
          placeholder="비밀번호"
          required
        >
        <button type="submit" class="btn-auth btn-email" id="email-auth-btn">
          로그인
        </button>
      </form>

      <div class="auth-divider">
        <span>또는</span>
      </div>

      <!-- Social Login Buttons -->
      <button class="btn-auth btn-google" id="google-login-btn">
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Google로 계속하기
      </button>

      <button class="btn-auth btn-github" id="github-login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub로 계속하기
      </button>

      <p class="auth-error" id="auth-error" style="display: none;"></p>
    </div>
  </div>

  <!-- Kanban Page (hidden by default) -->
  <div id="kanban-page" class="page-container" style="display: none;">
    <header>
      <div class="header-content">
        <h1>칸반보드</h1>
        <div class="user-info">
          <span id="user-email" class="user-email"></span>
          <button id="logout-btn" class="btn-logout">로그아웃</button>
        </div>
      </div>
    </header>

    <main class="board">
      <!-- To-Do Column -->
      <div class="column" id="column-todo" data-column-id="todo">
        <div class="column-header">
          <h2>To-Do</h2>
          <span class="card-count">0</span>
        </div>
        <div class="cards-container" id="cards-todo">
          <!-- Cards will be added here -->
        </div>
        <div class="add-card-form">
          <button class="add-card-btn" type="button" aria-label="Add new card to To-Do">
            + Add Card
          </button>
          <div class="add-card-input-container" style="display: none;">
            <textarea
              class="add-card-input"
              placeholder="Enter card content..."
              aria-label="New card content"
              rows="3"
            ></textarea>
            <div class="add-card-actions">
              <button class="btn-primary add-card-submit" type="button">Add</button>
              <button class="btn-secondary add-card-cancel" type="button">Cancel</button>
            </div>
          </div>
        </div>
      </div>

      <!-- In-Progress Column -->
      <div class="column" id="column-in-progress" data-column-id="in-progress">
        <div class="column-header">
          <h2>In-Progress</h2>
          <span class="card-count">0</span>
        </div>
        <div class="cards-container" id="cards-in-progress">
          <!-- Cards will be added here -->
        </div>
        <div class="add-card-form">
          <button class="add-card-btn" type="button" aria-label="Add new card to In-Progress">
            + Add Card
          </button>
          <div class="add-card-input-container" style="display: none;">
            <textarea
              class="add-card-input"
              placeholder="Enter card content..."
              aria-label="New card content"
              rows="3"
            ></textarea>
            <div class="add-card-actions">
              <button class="btn-primary add-card-submit" type="button">Add</button>
              <button class="btn-secondary add-card-cancel" type="button">Cancel</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Done Column -->
      <div class="column" id="column-done" data-column-id="done">
        <div class="column-header">
          <h2>Done</h2>
          <span class="card-count">0</span>
        </div>
        <div class="cards-container" id="cards-done">
          <!-- Cards will be added here -->
        </div>
        <div class="add-card-form">
          <button class="add-card-btn" type="button" aria-label="Add new card to Done">
            + Add Card
          </button>
          <div class="add-card-input-container" style="display: none;">
            <textarea
              class="add-card-input"
              placeholder="Enter card content..."
              aria-label="New card content"
              rows="3"
            ></textarea>
            <div class="add-card-actions">
              <button class="btn-primary add-card-submit" type="button">Add</button>
              <button class="btn-secondary add-card-cancel" type="button">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
